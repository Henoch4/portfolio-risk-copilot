[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_unused_ignores = False
warn_redundant_casts = True
no_implicit_optional = True
# The codebase is not yet fully annotated. We run mypy to catch real type
# errors (bad attribute/arg usage, wrong imports) in the typed surface and in
# already-annotated functions, rather than hard-failing the whole repo on
# untyped bodies. Tighten (disallow_untyped_defs=True) as coverage improves.
disallow_untyped_defs = False
disallow_untyped_calls = False
check_untyped_defs = False
