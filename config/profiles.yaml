# Curator profile allowlist — the ONLY risk-parameter vocabulary the curator
# may select from. The curator never writes raw risk/sizing params; it switches
# between these pre-bounded profiles. See src/curator.py and
# docs/adr/0001-fractional-kelly.md.
#
# Knob semantics (bps vocabulary, matching src/execution.py RiskGate):
#   position_size_multiplier  — fraction of half-Kelly base applied at sizing
#   confidence_floor_bps      — minimum ensemble confidence (0-10000 bps)
#   max_leverage              — max implied leverage for the profile (<= gate cap)
#   enabled_signals           — signal strategies allowed in this profile

default_profile: standard
cooldown_cycles: 24
auto_revert_lookback_trades: 10
auto_revert_threshold_pnl: -0.01

profiles:
  standard:
    position_size_multiplier: 0.65
    confidence_floor_bps: 7500
    max_leverage: 1.0
    enabled_signals:
      - funding_rate
  conservative:
    position_size_multiplier: 0.40
    confidence_floor_bps: 9000
    max_leverage: 0.5
    enabled_signals:
      - mean_reversion
      - funding_rate
  defensive:
    position_size_multiplier: 0.25
    confidence_floor_bps: 9000
    max_leverage: 0.5
    enabled_signals:
      - mean_reversion