name: Secret scan

# The pre-commit hook (.pre-commit-config.yaml) only protects a commit if
# the contributor installed it locally. This runs the same scan in CI on
# every push and PR, so a leak still gets caught even if someone skips the
# local hook, commits from a machine without it set up, or force-pushes.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
