name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install py-solc-x>=2.0.0 "eth-tester[py-evm]>=0.8.0"
          python -c "from solcx import install_solc; install_solc('0.8.29'); install_solc('0.8.30')"
      - name: Run tests
        run: python -m pytest tests/ -q
